<style>
:root{--ink:#083b36;--muted:#55736f;--teal:#087f72;--teal2:#05665c;--soft:#dff6f2;--yellow:#ffd166;--coral:#d94f4f;--line:#c7ddd9;--paper:#fff;font-family:"Trebuchet MS","Aptos",sans-serif;color:var(--ink);background:#eff8f6}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background-color:#eff8f6;background-image:linear-gradient(#087f720d 1px,transparent 1px),linear-gradient(90deg,#087f720d 1px,transparent 1px);background-size:28px 28px}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1160px,calc(100% - 40px));margin:auto;padding:22px 0 56px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font:700 25px Georgia,serif}.cube{width:48px;height:48px}.count{color:var(--teal);font-weight:800;font-size:23px}.count small{color:var(--muted);font-size:13px;font-weight:400}.tabs{display:grid;grid-template-columns:1fr 1fr;max-width:520px;padding:6px;margin-bottom:34px;border:1px solid var(--line);background:#ffffffc7;box-shadow:0 8px 30px #083b360f}.tab{min-height:48px;border:0;background:transparent;color:var(--muted);font-weight:800}.tab.on{background:var(--teal);color:white}.num{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:7px;border:1px solid;border-radius:50%}.view{display:none}.view.on{display:block;animation:enter .28s ease-out}@keyframes enter{from{opacity:0;transform:translateY(8px)}}.heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{margin:0 0 7px;color:var(--coral);font-size:12px;font-weight:800;letter-spacing:1.5px}h1,h2,h3{font-family:Georgia,serif}h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:0}h2{font-size:24px}.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:24px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);box-shadow:0 18px 50px #083b361f}.form{padding:26px}.form white}.score div{min-width:90px;padding:12px 16px;text-align:center;border-right:1px solid var(--line)}.score div:last-child{border:0}.score strong,.score span{display:block}.score strong{color:var(--teal);font-size:22px}.score span{color:var(--muted);font-size:12px}.practice-empty,.complete{padding:52px 24px}.practice-empty svg{width:min(220px,70%)}.game{padding:28px}.progress-row{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;color:var(--muted)}.track{height:8px;background:#e9f1ef;overflow:hidden}.track span{display:block;width:10%;height:100%;background:var(--yellow);transition:width .2s}.stage{text-align:center;padding:38px 20px 28px}.sound{position:relative;width:104px;height:104px;border:0;border-radius:50%;background:var(--yellow);color:var(--ink)}.sound:after{content:"";position:absolute;inset:-9px;border:2px solid var(--yellow);border-radius:50%;transition:.3s}.sound:hover:after{transform:scale(1.12);opacity:0}.sound svg{position:relative;z-index:1;width:46px}.stage p{margin:18px 0 10px;color:var(--muted)}.clue{color:var(--teal);font-size:20px;font-weight:800}.answer{width:min(680px,100%);margin:auto}.answer-row{display:grid;grid-template-columns:1fr auto}.answer-row input{min-height:56px;border-right:0;font-size:20px}.answer-row .primary{min-height:56px}.game-actions{display:flex;justify-content:center;gap:24px;margin-top:18px}.feedback,.hintbox{width:min(680px,100%);margin:18px auto 0;padding:14px 16px;text-align:center}.feedback:empty{display:none}.feedback.good{background:var(--soft);color:var(--teal2)}.feedback.bad{background:#fff0ef;color:#9d3939}.hintbox{border:1px dashed var(--teal);color:var(--muted)}.next{display:flex;margin:22px auto 0}.final{margin:16px 0;color:var(--teal)}.final strong{font-size:64px}.final span{font-size:24px}.toast{position:fixed;right:24px;bottom:24px;z-index:5;max-width:calc(100% - 48px);padding:14px 18px;background:var(--ink);color:white;box-shadow:0 18px 50px #083b3633;opacity:0;transform:translat .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.menu-card{position:relative;min-height:170px;padding:22px;border:1px solid var(--line);background:var(--paper);box-shadow:0 14px 38px #083b3617;text-align:left}.menu-card.selected{border:3px solid var(--teal);padding:20px}.menu-card h2{margin:12px 0 7px}.menu-card p{color:var(--muted)}.menu-card .badge{display:inline-block;padding:5px 9px;background:var(--soft);color:var(--teal);font-size:12px;font-weight:800}.menu-card .menu-actions{position:absolute;right:14px;top:14px}.menu-create{display:grid;place-items:center;border:2px dashed var(--line);box-shadow:none;color:var(--teal);text-align:center}.menu-create strong{display:block;font-size:42px;line-height:1}.active-list{margin:0 0 18px;padding:11px 14px;border-left:5px solid var(--yellow);background:#fff8dc;color:var(--muted)}.active-list strong{color:var(--ink)}dialog{width:min(440px,calc(100% - 32px));padding:0;border:1px solid var(--line);box-shadow:0 24px 80px #083b3652;color:var(--ink)}dialog::backdrop{background:#083b367a}.dialog-form{padding:26px}.dialog-form h2{margin-top:0}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.secondary{min-height:48px;padding:0 18px;border:1px solid var(--line);background:white;color:var(--ink);font-weight:800}.image-input{padding:10px;height:auto}.image-preview{position:relative;width:100%;aspect-ratio:16/9;margin:0 0 18px;border:1px solid var(--line);background:#eff8f6;overflow:hidden}.image-preview img{width:100%;height:100%;object-fit:contain}.image-preview button{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;background:#fff;color:var(--coral);font-size:22px;box-shadow:0 4px 14px #083b3629}.word-main{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}.word-thumb{width:76px;height:76px;object-fit:cover;border:1px solid var(--line);background:#eff8f6}.practice-image{display:block;width:min(420px,100%);height:240px;margin:0 auto 24px;object-fit:contain;border:1px solid var(--line);background:#f7fbfa}.stage.has-image{padding-top:26px}.letter-builder{margin-top:18px;padding:16px;border:1px solid var(--line);background:#f7fbfa}.letter-builder-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--muted);font-size:14px}.letter-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.letter-tile{display:grid;place-items:center;width:46px;height:48px;padding:0;border:2px solid var(--teal);background:white;color:var(--ink);font:700 22px Georgia,serif;text-transform:lowercase;box-shadow:0 4px 0 #b9d9d4;transition:transform .12s,opacity .12s}.letter-tile:hover:not(:disabled){transform:translateY(-2px);background:var(--soft)}.letter-tile:disabled{opacity:.22;box-shadow:none;transform:translateY(4px)}.undo-letter{width:38px;height:34px;border:1px solid var(--line);background:white;color:var(--teal);font-size:20px}.undo-letter:disabled{opacity:.35;cursor:default}
.zhuyin{margin-left:8px;color:var(--muted);font-size:.65em;font-weight:600;letter-spacing:0;white-space:nowrap}
.zhuyin-input-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:18px}.form .zhuyin-input-row input{margin-bottom:0}.auto-zhuyin{min-height:48px;padding:0 12px;border:1px solid var(--line);background:var(--soft);color:var(--teal);font-weight:800}.auto-zhuyin:disabled{cursor:wait;opacity:.65}
.practice-options{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px;padding:11px 14px;border-left:5px solid var(--yellow);background:#fff8dc;color:var(--muted)}.practice-options p{margin:0}.difficulty-switch{display:grid;grid-template-columns:1fr 1fr;padding:3px;border:1px solid var(--line);background:white}.difficulty-option{min-width:76px;min-height:38px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-weight:800}.difficulty-option.on{background:var(--teal);color:white}@media(max-width:560px){.practice-options{align-items:stretch;flex-direction:column}.difficulty-option{width:100%}}
.phonics-player{overflow:hidden}.phonics-screen{position:relative;min-height:430px;padding:42px;background:#073e3a;color:white}.phonics-screen::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:32px 32px}.phonics-scene{position:relative;z-index:1;display:grid;grid-template-columns:minmax(180px,.8fr) 1.2fr;gap:42px;align-items:center;animation:phonics-in .35s ease-out}@keyframes phonics-in{from{opacity:0;transform:translateY(12px)}}.phonics-symbol{display:grid;place-items:center;min-height:250px;border:2px solid #ffffff47;background:#ffffff10;text-align:center}.phonics-symbol strong{display:block;color:var(--yellow);font:700 clamp(72px,12vw,132px)/.9 Georgia,serif}.phonics-symbol span{display:block;margin-top:22px;font-size:25px;font-weight:800}.phonics-copy .eyebrow{color:#ffd166}.phonics-copy h2{margin:4px 0 12px;color:white;font-size:clamp(28px,5vw,48px)}.phonics-tip{margin:0 0 24px;color:#dff6f2;font-size:17px;line-height:1.7}.phonics-examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.phonics-word{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:9px;min-height:68px;padding:9px 13px;border:1px solid #ffffff42;background:#ffffff12;color:white;text-align:left}.phonics-word:hover,.phonics-word:focus-visible{background:#ffffff24}.phonics-word .picture{font-size:32px}.phonics-word strong{font-size:20px}.phonics-word small{display:block;color:#bde6df}.phonics-controls{padding:22px 26px;background:white}.phonics-progress{height:7px;margin-bottom:18px;background:#dfecea;overflow:hidden}.phonics-progress span{display:block;width:0;height:100%;background:var(--coral);transition:width .3s}.phonics-buttons{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.phonics-play{justify-self:center;min-width:150px}.phonics-counter{margin:14px 0 0;color:var(--muted);text-align:center}.phonics-strip{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:4px}.phonics-jump{flex:0 0 52px;height:42px;border:1px solid var(--line);background:white;color:var(--muted);font-weight:800}.phonics-jump.on{border-color:var(--teal);background:var(--soft);color:var(--teal)}@media(max-width:700px){.phonics-screen{min-height:0;padding:26px 20px}.phonics-scene{grid-template-columns:1fr;gap:20px}.phonics-symbol{min-height:180px}.phonics-examples{grid-template-columns:1fr}.phonics-buttons{grid-template-columns:1fr 1fr}.phonics-play{grid-column:1/-1;grid-row:1;width:100%}}
.phonics-categories{display:flex;gap:9px;margin:0 0 18px;padding:2px 0 8px;overflow-x:auto}.phonics-category{flex:0 0 auto;min-width:126px;padding:10px 13px;border:1px solid var(--line);background:white;color:var(--ink);text-align:left}.phonics-category strong,.phonics-category span{display:block}.phonics-category span{margin-top:3px;color:var(--muted);font-size:12px}.phonics-category.on{border-color:var(--teal);background:var(--teal);color:white}.phonics-category.on span{color:#dff6f2}
</style>

<body>
<div class="shell">
<header class="header"><div class="brand"><svg class="cube" viewBox="0 0 56 56" aria-hidden="true"><path d="M8 13.5 28 5l20 8.5v29L28 51 8 42.5z" fill="#ffd166"/><path d="m28 5 20 8.5L28 22 8 13.5z" fill="#ffe69a"/><path d="M28 22v29l20-8.5v-29z" fill="#f2b934"/><text x="17" y="40" fill="#083b36" font-size="21" font-family="Georgia" font-weight="700">A</text></svg><span>拼字小站</span></div><div class="count"><span id="count">0</span> <small>個單字</small></div></header>
<nav class="tabs" aria-label="主要功能" style="grid-template-columns:repeat(4,1fr);max-width:940px"><button class="tab on" data-view="menus"><span class="num">1</span>選擇清單</button><button class="tab" data-view="library"><span class="num">2</span>建立單字庫</button><button class="tab" data-view="practice"><span class="num">3</span>拼字練習</button><button class="tab" data-view="phonics"><span class="num">4</span>發音短影片</button></nav>
<main>
<section id="menus" class="view on">
<div class="heading"><div><p class="eyebrow">MY PRACTICE LISTS</p><h1>選擇練習清單</h1></div><div class="data-actions"><button id="exportData" class="secondary" type="button">↓ 匯出全部資料</button><button id="importData" class="primary" type="button">↑ 匯入資料</button><input id="importFile" class="hide" type="file" accept="application/json,.json"></div></div>
<div id="menuGrid" class="menu-grid"><button id="createMenu" class="menu-card menu-create" type="button"><span><strong>＋</strong>建立新清單</span></button></div>
</section>
<section id="library" class="view">
<div class="heading"><div><p class="eyebrow">MY WORD BANK</p><h1>建立你的單字庫</h1></div><button id="samples" class="link">加入範例單字</button></div>
<p class="active-list">目前清單：<strong id="libraryMenuName">我的單字</strong></p>
<div class="layout">
<form id="wordForm" class="panel form" autocomplete="off"><input id="editId" type="hidden"><div class="form-top"><h2 id="formTitle">新增單字</h2><button id="cancel" class="x hide" type="button" title="取消編輯">×</button></div><label for="word">英文單字</label><input id="word" placeholder="例如：adventure" spellcheck="false" required><label for="meaning">中文意思</label><input id="meaning" placeholder="例如：冒險" required><label for="zhuyin">注音 <span>可手動修改</span></label><div class="zhuyin-input-row"><input id="zhuyin" placeholder="輸入中文後自動產生"><button id="generateZhuyin" class="auto-zhuyin" type="button">自動產生</button></div><label for="hint">提示 <span>選填</span></label><textarea id="hint" rows="3" placeholder="例句、詞性或聯想提示"></textarea><label for="imageInput">單字圖片 <span>選填</span></label><input id="imageInput" class="image-input" type="file" accept="image/*"><div id="imagePreview" class="image-preview hide"><img id="imagePreviewPicture" alt="圖片預覽"><button id="removeImage" type="button" title="移除圖片" aria-label="移除圖片">×</button></div><button class="primary"><span id="saveText">加入單字庫</span><span>→</span></button></form>
<div class="panel list-panel"><div class="toolbar"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋單字或意思" aria-label="搜尋單字庫"></div><button id="clear" class="danger">清空</button></div><div id="empty" class="empty"><svg viewBox="0 0 160 112" aria-hidden="true"><path d="M24 27h51c10 0 18 8 18 18v49H42c-10 0-18-8-18-18z" fill="#dff6f2" stroke="#087f72" stroke-width="4"/><path d="M136 27H85c-10 0-18 8-18 18v49h51c10 0 18-8 18-18z" fill="#fff3c4" stroke="#087f72" stroke-width="4"/><path d="M67 44v50" stroke="#087f72" stroke-width="4"/></svg><h3>單字庫還是空的</h3><p>先加入第一個想練習的單字。</p></div><div id="wordList"></div></div>
</div></section>
<section id="practice" class="view">
<div class="heading practice-head"><div><p class="eyebrow">SPELLING PRACTICE</p><h1>聽一聽，拼出單字</h1></div><div class="score"><div><strong id="score">0</strong><span>答對</span></div><div><strong id="streak">0</strong><span>連勝</span></div><div><strong id="accuracy">--</strong><span>正確率</span></div></div></div>
<div class="practice-options"><p>練習清單：<strong id="practiceMenuName">我的單字</strong></p><div class="difficulty-switch" aria-label="選擇練習難度"><button class="difficulty-option" type="button" data-difficulty="easy" aria-pressed="false">簡單</button><button class="difficulty-option on" type="button" data-difficulty="hard" aria-pressed="true">難</button></div></div>
<div id="practiceEmpty" class="panel practice-empty"><svg viewBox="0 0 220 150" aria-hidden="true"><path d="M30 120c28-8 54-8 80 0V33c-26-8-52-8-80 0zM190 120c-28-8-54-8-80 0V33c26-8 52-8 80 0z" fill="#fff" stroke="#087f72" stroke-width="5"/><circle cx="110" cy="72" r="22" fill="#ffd166"/><path d="M102 65v14l13-7z" fill="#083b36"/></svg><h2>先準備單字庫</h2><p>至少加入一個單字，就能開始拼字練習。</p><button class="primary" data-library>前往建立單字庫</button></div>
<div id="game" class="panel game hide"><div class="progress-row"><span>第 <strong id="round">1</strong> / 10 題</span><div class="track"><span id="bar"></span></div></div><div id="practiceStage" class="stage"><img id="practiceImage" class="practice-image hide" alt="單字提示圖片"><button id="speak" class="sound" aria-label="播放單字發音"><svg viewBox="0 0 48 48"><path d="M9 19h8l10-8v26l-10-8H9z" fill="currentColor"/><path d="M33 18c3 3 3 9 0 12M38 13c6 6 6 16 0 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button><p>按下喇叭，聽聽看是什麼單字</p><div id="clue" class="clue"><span id="meaningClue"></span><span id="zhuyinClue" class="zhuyin hide"></span></div></div><form id="answerForm" class="answer"><label for="answer">你的答案</label><div class="answer-row"><input id="answer" placeholder="Type the word" spellcheck="false" autocapitalize="none" required><button class="primary">檢查</button></div><div class="letter-builder"><div class="letter-builder-head"><span>點選字母來拼字</span><button id="undoLetter" class="undo-letter" type="button" title="退回上一個字母" aria-label="退回上一個字母">↶</button></div><div id="letterTiles" class="letter-tiles" aria-label="可選字母"></div></div></form><div class="game-actions"><button id="showHint" class="link">顯示提示</button><button id="reveal" class="link">看答案</button></div><div id="feedback" class="feedback" aria-live="assertive"></div><div id="hintBox" class="hintbox hide"></div><button id="next" class="next hide">下一題 →</button></div>
<div id="complete" class="panel complete hide"><p class="eyebrow">ROUND COMPLETE</p><h2>這輪完成了！</h2><div class="final"><strong id="finalScore">0</strong><span>/ 10</span></div><p id="finalMessage"></p><button id="again" class="primary">再玩一輪</button></div>
</section>
<section id="phonics" class="view"><div class="heading"><div><p class="eyebrow">PHONICS SHORTS</p><h1>自然發音短影片</h1></div></div><div id="phonicsCategories" class="phonics-categories" aria-label="選擇發音分類"></div><div class="panel phonics-player"><div class="phonics-screen"><div id="phonicsScene" class="phonics-scene"></div></div><div class="phonics-controls"><div class="phonics-progress" aria-hidden="true"><span id="phonicsProgress"></span></div><div class="phonics-buttons"><button id="phonicsPrevious" class="secondary" type="button">← 上一部</button><button id="phonicsPlay" class="primary phonics-play" type="button">▶ 播放短影片</button><button id="phonicsNext" class="secondary" type="button">下一部 →</button></div><p id="phonicsCounter" class="phonics-counter"></p><div id="phonicsStrip" class="phonics-strip" aria-label="選擇同類短影片"></div></div></div></section>
</main></div><dialog id="menuDialog"><form id="menuDialogForm" class="dialog-form"><h2 id="menuDialogTitle">建立新清單</h2><label for="menuName">清單名稱</label><input id="menuName" maxlength="40" required><div class="dialog-actions"><button id="closeMenuDialog" class="secondary" type="button">取消</button><button class="primary" type="submit">儲存清單</button></div></form></dialog><div id="toast" class="toast" role="status"></div>
<script type="text/plain" id="legacy-script">
const KEY="spelling-game-words-v1",LEN=10,samples=[{word:"adventure",meaning:"冒險",hint:"An exciting or unusual experience."},{word:"beautiful",meaning:"美麗的",hint:"It starts with beau-."},{word:"knowledge",meaning:"知識",hint:"What you learn and understand."},{word:"necessary",meaning:"必要的",hint:"One collar and two sleeves: one c, two s."},{word:"tomorrow",meaning:"明天",hint:"One m, two r."}];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);let words=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}})(),current=null,round=0,score=0,streak=0,attempts=0,answered=false,deck=[];
const norm=s=>s.trim().toLowerCase(),esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML},save=()=>{localStorage.setItem(KEY,JSON.stringify(words));render();availability()},toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove("show"),2000)};
function go(name){$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.view===name));$$('.view').forEach(x=>x.classList.toggle('on',x.id===name));if(name==='practice')availability()}
function render(){let q=norm($('#search').value),list=words.filter(x=>norm(x.word).includes(q)||norm(x.meaning).includes(q));$('#count').textContent=words.length;$('#empty').classList.toggle('hide',words.length>0);$('#clear').disabled=!words.length;$('#wordList').innerHTML=list.map(x=>`<article class="word" data-id="${x.id}"><div><h3>${esc(x.word)}</h3><div class="meaning">${esc(x.meaning)}</div>${x.hint?`<p class="hint">${esc(x.hint)}</p>`:''}</div><div class="actions"><button class="action hear" title="播放發音">▶</button><button class="action edit" title="編輯">✎</button><button class="action del" title="刪除">×</button></div></article>`).join('')}
function reset(){$('#wordForm').reset();$('#editId').value='';$('#formTitle').textContent='新增單字';$('#saveText').textContent='加入單字庫';$('#cancel').classList.add('hide')}
function speak(t){if(!('speechSynthesis'in window)){toast('瀏覽器不支援語音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function availability(){let ok=words.length>0;$('#practiceEmpty').classList.toggle('hide',ok);if(!ok){$('#game').classList.add('hide');$('#complete').classList.add('hide')}else if(!current&&round===0)start()}
function start(){round=score=streak=attempts=0;deck=[];while(deck.length<LEN)deck.push(...[...words].sort(()=>Math.random()-.5));deck=deck.slice(0,LEN);$('#complete').classList.add('hide');$('#game').classList.remove('hide');question()}
function board(){$('#score').textContent=score;$('#streak').textContent=streak;$('#accuracy').textContent=attempts?Math.round(score/attempts*100)+'%':'--'}
function question(){if(round>=LEN){current=null;$('#game').classList.add('hide');$('#complete').classList.remove('hide');$('#finalScore').textContent=score;$('#finalMessage').textContent=score>=8?'拼得很漂亮，保持這個節奏！':score>=5?'越來越熟了，再挑戰一次吧。':'慢慢來，多聽幾次就會記住。';return}current=deck[round++];answered=false;$('#round').textContent=round;$('#bar').style.width=round*10+'%';$('#clue').textContent=current.meaning;$('#answer').value='';$('#answer').disabled=false;$('#feedback').textContent='';$('#feedback').className='feedback';$('#hintBox').classList.add('hide');$('#next').classList.add('hide');board();$('#answer').focus();setTimeout(()=>speak(current.word),250)}
function resolve(correct){attempts++;answered=true;$('#answer').disabled=true;if(correct){score++;streak++;$('#feedback').textContent='答對了！'+current.word;$('#feedback').className='feedback good'}else{streak=0;$('#feedback').textContent='差一點！正確答案是 '+current.word;$('#feedback').className='feedback bad'}$('#next').classList.remove('hide');board()}
$$('.tab').forEach(x=>x.onclick=()=>go(x.dataset.view));$$('[data-library]').forEach(x=>x.onclick=()=>go('library'));$('#wordForm').onsubmit=e=>{e.preventDefault();let w=$('#word').value.trim(),m=$('#meaning').value.trim(),h=$('#hint').value.trim(),id=$('#editId').value;if(words.some(x=>norm(x.word)===norm(w)&&x.id!==id)){toast('這個單字已存在');return}if(id){words=words.map(x=>x.id===id?{...x,word:w,meaning:m,hint:h}:x);toast('單字已更新')}else{words.unshift({id:crypto.randomUUID(),word:w,meaning:m,hint:h});toast('已加入單字庫')}reset();save()};$('#cancel').onclick=reset;$('#search').oninput=render;$('#wordList').onclick=e=>{let a=e.target.closest('.word');if(!a)return;let x=words.find(w=>w.id===a.dataset.id);if(e.target.closest('.hear'))speak(x.word);if(e.target.closest('.edit')){$('#editId').value=x.id;$('#word').value=x.word;$('#meaning').value=x.meaning;$('#hint').value=x.hint;$('#formTitle').textContent='編輯單字';$('#saveText').textContent='儲存修改';$('#cancel').classList.remove('hide');$('#word').focus()}if(e.target.closest('.del')&&confirm(`刪除「${x.word}」？`)){words=words.filter(w=>w.id!==x.id);save();toast('單字已刪除')}};$('#samples').onclick=()=>{let n=0;samples.forEach(s=>{if(!words.some(x=>norm(x.word)===norm(s.word))){words.push({...s,id:crypto.randomUUID()});n++}});save();toast(n?`已加入 ${n} 個範例單字`:'範例已存在')};$('#clear').onclick=()=>{if(words.length&&confirm('確定清空單字庫？')){words=[];current=null;round=0;save();reset()}};$('#answerForm').onsubmit=e=>{e.preventDefault();if(!answered&&norm($('#answer').value))resolve(norm($('#answer').value)===norm(current.word))};$('#speak').onclick=()=>current&&speak(current.word);$('#showHint').onclick=()=>{let fallback=`開頭是「${current.word[0]}」，共有 ${current.word.length} 個字母。`;$('#hintBox').textContent=current.hint||fallback;$('#hintBox').classList.remove('hide')};$('#reveal').onclick=()=>{if(!answered){$('#answer').value=current.word;resolve(false)}};$('#next').onclick=question;$('#again').onclick=start;render();availability();
</script>
